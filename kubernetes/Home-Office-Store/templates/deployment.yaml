---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.backend.name }}
  labels:
    {{- include "Home-Office-Store.backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "Home-Office-Store.backend.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "Home-Office-Store.backend.labels" . | nindent 8 }}
    spec:
      containers:
      - name: {{ .Values.backend.flaskBackend.name }}
        image: {{ .Values.backend.flaskBackend.image }}
        ports:
        - containerPort: {{ .Values.backend.flaskBackend.port }}
        env:
        - name: N8N_WEBHOOK_URL 
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.cm.name }}
              key: n8n_webhook_url
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.cm.name }}
              key: cors_origins
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.cm.name }}
              key: db_host
        - name: DB_PORT 
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.cm.name }}
              key: db_port
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.cm.name }}
              key: db_name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.name }}
              key: db_user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.name }}
              key: db_password
        resources:
          requests:
            memory: {{ .Values.backend.resources.requests.memory }}
            cpu: {{ .Values.backend.resources.requests.cpu }}
          limits:
            memory: {{ .Values.backend.resources.limits.memory }}
            cpu: {{ .Values.backend.resources.limits.cpu }}

---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.frontend.name }}
  labels:
    {{- include "Home-Office-Store.frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "Home-Office-Store.frontend.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "Home-Office-Store.frontend.labels" . | nindent 8 }}
    spec:
      containers:
      - name: {{ .Values.frontend.reactFrontend.name }}
        image: {{ .Values.frontend.reactFrontend.image }}
        ports:
        - containerPort: {{ .Values.frontend.reactFrontend.port }}
        env:
        - name: NEXT_PUBLIC_API_URL
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.cm.name }}
              key: backend_svc
        - name: NODE_ENV
          value: development
        resources:
          requests:
            memory: {{ .Values.frontend.resources.requests.memory }}
            cpu: {{ .Values.frontend.resources.requests.cpu }}
          limits:
            memory: {{ .Values.frontend.resources.limits.memory }}
            cpu: {{ .Values.frontend.resources.limits.cpu }}

---
# N8N Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.n8n.name }}
  labels:
    {{- include "Home-Office-Store.n8n.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.n8n.replicas }}
  selector:
    matchLabels:
      {{- include "Home-Office-Store.n8n.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "Home-Office-Store.n8n.labels" . | nindent 8 }}
    spec:
      containers:
      - name: {{ .Values.n8n.n8n.name }}
        image: {{ .Values.n8n.n8n.image }}
        ports:
        - containerPort: {{ .Values.n8n.n8n.port }}
        env:
        - name: DB_POSTGRESDB_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.cm.name }}
              key: db_host
        - name: DB_POSTGRESDB_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.cm.name }}
              key: db_port
        - name: DB_POSTGRESDB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.cm.name }}
              key: db_name
        - name: DB_POSTGRESDB_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.name }}
              key: db_user
        - name: DB_POSTGRESDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.name }}
              key: db_password
        - name: N8N_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.name }}
              key: n8n_api_key
        - name: N8N_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.name }}
              key: n8n_encryption_key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.name }}
              key: open_ai_api_key
        envFrom:
        - configMapRef:
            name: {{ .Values.n8nCm.name }}
        resources:
          requests:
            memory: {{ .Values.n8n.resources.requests.memory }}
            cpu: {{ .Values.n8n.resources.requests.cpu }}
          limits:
            memory: {{ .Values.n8n.resources.limits.memory }}
            cpu: {{ .Values.n8n.resources.limits.cpu }}