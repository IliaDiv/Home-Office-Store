services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      - API_URL=http://backend:5000
      - NGINX_PORT=80
    depends_on:
      - backend-svc

  backend-svc:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/chat
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000,http://localhost,https://localhost
      - DB_HOST=$DB_HOST
      - DB_PORT=$DB_PORT
      - DB_NAME=$DB_NAME
      - DB_USER=$DB_USER
      - DB_PASSWORD=$DB_PASSWORD
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_started

  n8n:
    build: ./backend/n8n
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=$DB_HOST
      - DB_POSTGRESDB_PORT=$DB_PORT
      - DB_POSTGRESDB_DATABASE=$DB_NAME
      - DB_POSTGRESDB_USER=$DB_USER
      - DB_POSTGRESDB_PASSWORD=$DB_PASSWORD
      - OPENAI_API_KEY=$OPENAI_API_KEY
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_DEFAULT_LOCALE=en
      - N8N_METRICS=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - N8N_SKIP_SETUP=true
      - N8N_API_KEY=n8n-api-key-12345
      - N8N_ENCRYPTION_KEY=your-encryption-key
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_USER_MANAGEMENT_DISABLED=true
      - N8N_API_AUTH_ENABLED=true
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://n8n:5678
      - N8N_DISABLE_UI=false
      - N8N_DISABLE_PRODUCTION_MAIN_PROCESS=false
      - N8N_EDITOR_BASE_URL=http://localhost:5678
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_RUNNERS_ENABLED=true
  
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: $DB_USER
      POSTGRES_PASSWORD: $DB_PASSWORD
      POSTGRES_DB: $DB_NAME
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d home_office_store"]
      interval: 5s
      timeout: 5s
      retries: 5
